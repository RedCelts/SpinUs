name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The ubuntu runner ships the Android SDK (ANDROID_HOME); AGP
      # downloads any missing platform itself.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk OnielMusic-v1.0.3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OnielMusic-v1.0.3
          path: OnielMusic-v1.0.3.apk
