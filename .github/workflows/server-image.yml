name: Server image

# Builds the SpinUs server Docker image and publishes it to
# ghcr.io/redcelts/spinus-server, so CasaOS can install it by name.
on:
  push:
    branches: [main, spinus-server]
    paths: ['server/**', '.github/workflows/server-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/redcelts/spinus-server:latest
            ghcr.io/redcelts/spinus-server:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/RedCelts/oniel-music
            org.opencontainers.image.description=SpinUs music server
