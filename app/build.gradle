plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.oniel.music'
    compileSdk 34

    defaultConfig {
        applicationId "com.oniel.music"
        minSdk 26
        targetSdk 34
        versionCode 19
        versionName "1.3.4"
    }

    // Sign with the same key as every APK already on the phone
    // (SHA-256 3AB0F198...), so new builds install over the old app.
    // Store the embedded Tailscale library compressed (smaller download;
    // Android unpacks it at install time).
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
}

dependencies {
    // Jetpack Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Media3 (ExoPlayer) for audio playback
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'
    // Streams over the app's own OkHttp client (so Tailscale routing applies)
    implementation 'androidx.media3:media3-datasource-okhttp:1.3.1'

    // Embedded Tailscale (Go tsnet via gomobile) — built by build-tsbridge.sh
    implementation files('libs/tsbridge.aar')

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Image loading
    implementation 'io.coil-kt:coil-compose:2.6.0'
    // Frosted (blurred) tab bar and status-bar strip.
    implementation 'dev.chrisbanes.haze:haze:0.7.3'

    // Preferences storage (server address, settings)
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Room (on-device play log)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
}
